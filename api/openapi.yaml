          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /changes:
    get:
      tags: [Changes]
      operationId: listChanges
      summary: List changes since a sequence number
      description: |
        Returns what changed in the account, in order, so a client can catch up without refetching everything. Poll with the `latest` value from the previous reply as `since`.

        Entries are kept for the retention window, so a client that has been away longer than that should refetch rather than replay.

        Requires scope `calendars:read`.
      x-scope: calendars:read
      security: *readAuth
      parameters:
        - $ref: "#/components/parameters/ChangesSince"
        - $ref: "#/components/parameters/ChangesLimit"
      responses:
        "200":
          description: Changes in ascending order, oldest first.
          headers: *okHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
              example:
                items:
                  - seq: 42
                    entity: event
                    id: "0191f2c5-1b2c-7d4e-8f90-a1b2c3d4e5f6"
                    op: update
                    calendar_id: "0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10"
                    list_id: null
                    from: "2026-09-07T07:00:00Z"
                    to: "2026-09-07T07:15:00Z"
                    origin: google
                latest: 57
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /sync/status:
    get:
      tags: [Sync]
      operationId: getSyncStatus
      summary: Get Google sync status
      description: |
        Returns whether Google is connected and what each binding is doing, including how many local changes are still waiting to be pushed.

        Requires scope `sync:write`, because the same scope covers starting a sync.
      x-scope: sync:write
      security: *readAuth
      responses:
        "200":
          description: The sync status of the account.
          headers: *okHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
              example:
                connected: true
                email: sasha@gmail.com
                status: ok
                bindings:
                  - id: "0191f2f1-2222-7000-8000-a1b2c3d4e5f6"
                    entity: event
                    remote_id: primary
                    remote_name: sasha@gmail.com
                    local_id: "0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10"
                    direction: both
                    enabled: true
                    pending: 0
                    watching: true
                    last_synced_at: "2026-09-12T08:10:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /sync/run:
    post:
      tags: [Sync]
      operationId: runSync
      summary: Sync with Google now
      description: |
        Queues a pull for every enabled binding. The work happens in the background, so this returns before it finishes; poll `/sync/status` to see it land.

        Requires scope `sync:write`.
      x-scope: sync:write
      security: *writeAuth
      responses:
        "202":
          description: The sync was queued.
          headers: *okHeaders
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: cal_<prefix>_<secret>
      description: API token created in Settings → API tokens.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sid
      description: >-
        Browser session cookie, set by signing in. It is named `sid` when the server runs over plain HTTP.
        Unsafe methods also need the `X-CSRF-Token` header.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        CSRF token of the browser session, required together with `sessionCookie` on unsafe methods.
        Pages expose it in the `csrf-token` meta tag.
  parameters:
    CalendarID:
      name: id
      in: path
      required: true
      description: Calendar ID.
      schema:
        type: string
        format: uuid
      example: "0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10"
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: ETag from an earlier response. The request fails with `412` if the resource changed since then.
      schema:
        type: string
      example: '"lx3kq9zb"'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag from an earlier response. The server answers `304` without a body if the resource is unchanged.
      schema:
        type: string
      example: '"lx3kq9zb"'
    EventID:
      name: id
      in: path
      required: true
      description: Event ID.
      schema:
        type: string
        format: uuid
      example: "0191f2c5-1b2c-7d4e-8f90-a1b2c3d4e5f6"
    RangeFrom:
      name: from
      in: query
      required: true
      description: Start of the range, inclusive. An RFC 3339 date-time, or a date for midnight in the account timezone.
      schema:
        type: string
      example: "2026-09-07T00:00:00+03:00"
    RangeTo:
      name: to
      in: query
      required: true
      description: End of the range, exclusive. An RFC 3339 date-time, or a date for midnight in the account timezone.
      schema:
        type: string
      example: "2026-09-14"
    CalendarFilter:
      name: calendar_id
      in: query
      required: false
      description: Only include these calendars. Repeat the parameter or separate IDs with commas. Without it, every calendar that is not hidden is included.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
      example: ["0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10"]
    Expand:
      name: expand
      in: query
      required: false
      description: Expand recurring series into occurrences.
      schema:
        type: boolean
        default: true
      example: true
    EditScope:
      name: scope
      in: query
      required: false
      description: >-
        Part of a recurring series to change: `this` occurrence, `following` occurrences, or `all`.
        Defaults to `this` when `instance` is set or the event is a changed occurrence, and to `all` otherwise.
      schema:
        type: string
        enum: [this, following, all]
      example: this
    Instance:
      name: instance
      in: query
      required: false
      description: >-
        Original start of the occurrence, as returned in the `instance` field. Required with `this` and
        `following` when the path points at a series.
      schema:
        type: string
      example: "2026-09-11T10:00:00+03:00"
    TodoListID:
      name: id
      in: path
      required: true
      description: Todo list ID.
      schema:
        type: string
        format: uuid
      example: "0191f2c7-3e4f-7a51-9b62-c3d4e5f60718"
    TodoID:
      name: id
      in: path
      required: true
      description: Todo ID.
      schema:
        type: string
        format: uuid
      example: "0191f2c8-4f50-7b62-8c73-d4e5f6071829"
    CheckID:
      name: cid
      in: path
      required: true
      description: Checklist item ID.
      schema:
        type: string
        format: uuid
      example: "0191f2c9-5061-7c73-9d84-e5f607182930"
    TodoListFilter:
      name: list_id
      in: query
      required: false
      description: Only include these lists. Repeat the parameter or separate IDs with commas.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
      example: ["0191f2c7-3e4f-7a51-9b62-c3d4e5f60718"]
    ParentFilter:
      name: parent_id
      in: query
      required: false
      description: Only include subtasks of this todo.
      schema:
        type: string
        format: uuid
      example: "0191f2c8-4f50-7b62-8c73-d4e5f6071829"
    TodoStatus:
      name: status
      in: query
      required: false
      description: Which todos to include.
      schema:
        type: string
        enum: [open, completed, all]
        default: open
      example: open
    DueFrom:
      name: due_from
      in: query
      required: false
      description: Only include todos due on or after this date.
      schema:
        type: string
        format: date
      example: "2026-09-10"
    DueTo:
      name: due_to
      in: query
      required: false
      description: Only include todos due before this date.
      schema:
        type: string
        format: date
      example: "2026-09-17"
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `next_cursor` of the previous page.
      schema:
        type: string
      example: "0191f2c8-4f50-7b62-8c73-d4e5f6071829"
    Limit:
      name: limit
      in: query
      required: false
      description: Items per page.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      example: 100
    ImportID:
      name: id
      in: path
      required: true
      description: Import ID.
      schema:
        type: string
        format: uuid
      example: "0191f2d0-1111-7000-8000-a1b2c3d4e5f6"
    ImportLimit:
      name: limit
      in: query
      required: false
      description: Imports to return, 1 to 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
    ExportCalendars:
      name: calendar_id
      in: query
      required: false
      description: Only these calendars. Repeat the parameter or separate IDs with commas. Without it every calendar is included.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
      example: ["0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10"]
    SubscriptionID:
      name: id
      in: path
      required: true
      description: Subscription ID.
      schema:
        type: string
        format: uuid
      example: "0191f2d1-2222-7000-8000-a1b2c3d4e5f6"
    DuplicateID:
      name: id
      in: path
      required: true
      description: Duplicate pair ID.
      schema:
        type: string
        format: uuid
      example: "0191f2e0-1111-7000-8000-a1b2c3d4e5f6"
    DuplicateStatus:
      name: status
      in: query
      required: false
      description: Which pairs to return.
      schema:
        type: string
        enum: [pending, merged, deleted, dismissed]
        default: pending
      example: pending
    TrashEntity:
      name: entity
      in: path
      required: true
      description: Whether the entry is an event or a todo.
      schema:
        type: string
        enum: [event, todo]
      example: event
    TrashID:
      name: id
      in: path
      required: true
      description: ID of the deleted entry.
      schema:
        type: string
        format: uuid
      example: "0191f2c5-1b2c-7d4e-8f90-a1b2c3d4e5f6"
    TrashLimit:
      name: limit
      in: query
      required: false
      description: Entries to return per kind, 1 to 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
      example: 100
    SearchQuery:
      name: q
      in: query
      required: true
      description: The query, with words, phrases and filters.
      schema:
        type: string
        maxLength: 500
      example: standup in:Work after:today
    SearchType:
      name: type
      in: query
      required: false
      description: Limit to one kind. A `type:` filter inside the query wins.
      schema:
        type: string
        enum: [event, todo]
      example: todo
    SearchLimit:
      name: limit
      in: query
      required: false
      description: Results per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      example: 25
    SearchOffset:
      name: offset
      in: query
      required: false
      description: Results to skip. Use `next_offset` from the previous page.
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    ShareID:
      name: id
      in: path
      required: true
      description: Share link ID.
      schema:
        type: string
        format: uuid
      example: "0191f2f0-1111-7000-8000-a1b2c3d4e5f6"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Repeat this value to retry safely; the first reply is replayed instead of creating a second entry.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 7b1f0c2e-9a44-4f7e-9f2e-3d5c8a1b2c3d
    ChangesSince:
      name: since
      in: query
      required: false
      description: Return changes after this sequence number. Use `latest` from the previous reply.
      schema:
        type: integer
        format: int64
        minimum: 0
        default: 0
      example: 42
    ChangesLimit:
      name: limit
      in: query
      required: false
      description: Changes to return, 1 to 1000.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 200
      example: 200
  headers:
    ETag:
      description: Version of the resource. Send it in `If-Match` to avoid overwriting other changes.
      schema:
        type: string
      example: '"lx3kq9zb"'
    Location:
      description: URL of the created resource.
      schema:
        type: string
      example: /api/v1/calendars/0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10
    RateLimitLimit:
      description: Requests allowed per window.
      schema:
        type: integer
        minimum: 1
      example: 600
    RateLimitRemaining:
      description: Requests left in the current window.
      schema:
        type: integer
        minimum: 0
      example: 599
    RateLimitReset:
      description: Seconds until the full quota is available again.
      schema:
        type: integer
        minimum: 0
      example: 1
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
      example: 12
    RequestID:
      description: Request identifier, also returned in error bodies as `request_id`.
      schema:
        type: string
      example: tQ6DNZRbQcyrEPPA
  responses:
    PayloadTooLarge:
      description: The uploaded file is larger than the server accepts.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Request Entity Too Large
            status: 413
            instance: /api/v1/imports
            request_id: tQ6DNZRbQcyrEPPA
    NotModified:
      description: The resource matches the ETag in `If-None-Match`.
      headers:
        ETag:
          $ref: "#/components/headers/ETag"
    Unauthorized:
      description: The token or session is missing, invalid, revoked or expired.
      headers:
        WWW-Authenticate:
          description: Authentication scheme to use.
          schema:
            type: string
          example: 'Bearer realm="calendar"'
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Unauthorized
            status: 401
            detail: invalid api token
            instance: /api/v1/me
            request_id: tQ6DNZRbQcyrEPPA
    Forbidden:
      description: The token lacks the required scope, or a session request failed the CSRF or origin check.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            scope:
              summary: Missing scope
              value:
                type: "about:blank"
                title: Forbidden
                status: 403
                detail: "token lacks scope calendars:write"
                instance: /api/v1/calendars
                request_id: tQ6DNZRbQcyrEPPA
            csrf:
              summary: Missing CSRF token
              value:
                type: "about:blank"
                title: Forbidden
                status: 403
                detail: invalid csrf token
                instance: /api/v1/calendars
                request_id: tQ6DNZRbQcyrEPPA
    NotFound:
      description: The resource does not exist or belongs to another account.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Not Found
            status: 404
            instance: /api/v1/calendars/0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10
            request_id: tQ6DNZRbQcyrEPPA
    Conflict:
      description: The request conflicts with the current state, for example deleting the default calendar.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Conflict
            status: 409
            detail: the default calendar cannot be deleted
            instance: /api/v1/calendars/0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10
            request_id: tQ6DNZRbQcyrEPPA
    PreconditionFailed:
      description: The resource changed since the ETag in `If-Match` was issued.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Precondition Failed
            status: 412
            detail: resource was modified, reload it and retry
            instance: /api/v1/calendars/0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10
            request_id: tQ6DNZRbQcyrEPPA
    UnsupportedMediaType:
      description: The request body has the wrong `Content-Type`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Unsupported Media Type
            status: 415
            detail: content type must be application/json
            instance: /api/v1/calendars
            request_id: tQ6DNZRbQcyrEPPA
    UnprocessableEntity:
      description: The request body is well formed but some fields are invalid.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Unprocessable Entity
            status: 422
            detail: One or more fields are invalid.
            instance: /api/v1/calendars
            request_id: tQ6DNZRbQcyrEPPA
            errors:
              - field: color
                message: "must be a hex color like #3b6ea5"
    TooManyRequests:
      description: The rate limit was exceeded.
      headers:
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimitLimit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimitRemaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimitReset"
        X-Request-ID:
          $ref: "#/components/headers/RequestID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: "about:blank"
            title: Too Many Requests
            status: 429
            detail: too many attempts, retry in 12s
            instance: /api/v1/me
            request_id: tQ6DNZRbQcyrEPPA
  schemas:
    Share:
      type: object
      description: A read-only link to one fixed period of the calendar.
      additionalProperties: false
      required: [id, name, url, view, period, calendars, detail, tz_mode, include_todos, show_sleep, active, access_count, last_accessed_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Share link ID.
        name:
          type: string
          maxLength: 100
          description: Name shown to whoever opens the link.
        url:
          type: string
          description: Full address of the link. Empty once the link is revoked.
        view:
          type: string
          enum: [day, 3day, week, month, year, agenda]
          description: Layout the period is shown in.
        period:
          type: string
          format: date
          description: First day of the period, as `YYYY-MM-DD`.
        calendars:
          type: array
          description: Calendars included in the link. Empty means every calendar.
          items:
            type: string
            format: uuid
        detail:
          type: string
          enum: [busy, titles, full]
          description: "`busy` hides titles, `titles` shows them, `full` also shows descriptions and locations."
        tz_mode:
          type: string
          enum: [owner, viewer]
          description: Whether times are shown in the owner's timezone or the viewer's.
        include_todos:
          type: boolean
          description: Whether scheduled todos appear alongside events.
        show_sleep:
          type: boolean
          description: Whether the sleep band is drawn.
        active:
          type: boolean
          description: Whether the address still works.
        access_count:
          type: integer
          format: int64
          minimum: 0
          description: How many times the link has been opened.
        last_accessed_at:
          type: string
          format: date-time
          nullable: true
          description: When the link was last opened.
        created_at:
          type: string
          format: date-time
          description: When the link was created.
        updated_at:
          type: string
          format: date-time
          description: When the link was last changed.
    ShareInput:
      type: object
      description: Fields of a share link. Every field is optional on a change.
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 100
          description: Name shown to whoever opens the link.
        view:
          type: string
          enum: [day, 3day, week, month, year, agenda]
          description: Layout the period is shown in.
        period:
          type: string
          format: date
          description: Any day inside the period, as `YYYY-MM-DD`; it is snapped to the start.
        calendars:
          type: array
          description: Calendars to include. Empty means every calendar.
          items:
            type: string
            format: uuid
        detail:
          type: string
          enum: [busy, titles, full]
          description: How much of each entry to show.
        tz_mode:
          type: string
          enum: [owner, viewer]
          description: Whose timezone times are shown in.
        include_todos:
          type: boolean
          description: Whether to include scheduled todos.
        show_sleep:
          type: boolean
          description: Whether to draw the sleep band.
    ShareList:
      type: object
      description: Share links of the account.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: The links, newest first.
          items:
            $ref: "#/components/schemas/Share"
    Change:
      type: object
      description: One recorded change to an event or todo.
      additionalProperties: false
      required: [seq, entity, id, op, calendar_id, list_id, from, to]
      properties:
        seq:
          type: integer
          format: int64
          description: Position in the account's change log. Always increasing.
        entity:
          type: string
          enum: [event, todo, calendar, list, settings, share]
          description: What changed.
        id:
          type: string
          format: uuid
          description: ID of the entry that changed.
        op:
          type: string
          enum: [create, update, delete]
          description: What happened to it.
        calendar_id:
          type: string
          format: uuid
          nullable: true
          description: Calendar the entry belongs to, for events.
        list_id:
          type: string
          format: uuid
          nullable: true
          description: List the entry belongs to, for todos.
        from:
          type: string
          format: date-time
          nullable: true
          description: Start of the range the change affects, for refreshing a view.
        to:
          type: string
          format: date-time
          nullable: true
          description: End of that range.
        origin:
          type: string
          description: What made the change, such as `google` or `import`. Empty when it came from this app.
    ChangeList:
      type: object
      description: Changes in ascending order, oldest first.
      additionalProperties: false
      required: [items, latest]
      properties:
        items:
          type: array
          description: The changes.
          items:
            $ref: "#/components/schemas/Change"
        latest:
          type: integer
          format: int64
          description: Newest sequence number in the account. Send it back as `since` to continue.
    SyncStatus:
      type: object
      description: Whether Google is connected and what each binding is doing.
      additionalProperties: false
      required: [connected, email, status, bindings]
      properties:
        connected:
          type: boolean
          description: Whether a usable Google connection exists.
        email:
          type: string
          description: Google account the connection belongs to.
        status:
          type: string
          description: "`ok`, or why the connection stopped working."
        last_error:
          type: string
          description: Detail of the last failure.
        bindings:
          type: array
          description: One per calendar or list being synced.
          items:
            $ref: "#/components/schemas/SyncBinding"
    SyncBinding:
      type: object
      description: A local calendar or list paired with a Google one.
      additionalProperties: false
      required: [id, entity, remote_id, remote_name, local_id, direction, enabled, pending, watching, last_synced_at]
      properties:
        id:
          type: string
          format: uuid
          description: Binding ID.
        entity:
          type: string
          enum: [event, todo]
          description: Whether the pair holds events or todos.
        remote_id:
          type: string
          description: Google's identifier for the calendar or task list.
        remote_name:
          type: string
          description: Name of the Google calendar or task list.
        local_id:
          type: string
          format: uuid
          description: Local calendar or list it is paired with.
        direction:
          type: string
          enum: [both, pull, push]
          description: Which way changes travel.
        enabled:
          type: boolean
          description: Whether this pair is syncing.
        pending:
          type: integer
          minimum: 0
          description: Local changes still waiting to reach Google.
        watching:
          type: boolean
          description: Whether Google pushes notifications for this pair, rather than being polled.
        last_synced_at:
          type: string
          format: date-time
          nullable: true
          description: When this pair last synced.
    ICSDocument:
      type: string
      description: An iCalendar document.
    CSVDocument:
      type: string
      description: A CSV file with one row per event.
    AccountYAML:
      type: string
      description: The whole account in this app's own YAML format.
    Import:
      type: object
      description: An uploaded file, what it holds, and the result of writing it in.
      additionalProperties: false
      required: [id, source, filename, status, preview, stats, created_at, expires_at, finished_at]
      properties:
        id:
          type: string
          format: uuid
          description: Import ID.
        source:
          type: string
          enum: [ics, csv, yaml, ics_url]
          description: File type detected from the content and name.
        filename:
          type: string
          maxLength: 255
          description: Name of the uploaded file.
        status:
          type: string
          enum: [pending, previewed, committing, done, failed, expired]
          description: "`previewed` is waiting to be committed, `done` finished, `failed` could not be written in."
        preview:
          allOf:
            - $ref: "#/components/schemas/ImportPreview"
          nullable: true
          description: What the file holds. Null when listing.
        stats:
          allOf:
            - $ref: "#/components/schemas/ImportStats"
          nullable: true
          description: Result of writing the file in. Null before it is committed.
        error:
          type: string
          description: Why the import failed.
        created_at:
          type: string
          format: date-time
          description: When the file was uploaded.
        expires_at:
          type: string
          format: date-time
          description: When the uploaded file is discarded and can no longer be committed.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: When the import was written in.
    ImportList:
      type: object
      description: Recent imports, newest first.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Imports without their previews.
          items:
            $ref: "#/components/schemas/Import"
    ImportPreview:
      type: object
      description: What an uploaded file holds, before anything is written.
      additionalProperties: false
      required: [source, filename, timezone, targets, stats, samples, problems, settings]
      properties:
        source:
          type: string
          description: File type the preview was read with.
        filename:
          type: string
          description: Name of the uploaded file.
        timezone:
          type: string
          description: IANA timezone used to read times without an offset.
        targets:
          type: array
          description: One per calendar or list found in the file.
          items:
            $ref: "#/components/schemas/ImportTarget"
        stats:
          $ref: "#/components/schemas/ImportStats"
        samples:
          type: array
          maxItems: 50
          description: A few entries with what would happen to each.
          items:
            $ref: "#/components/schemas/ImportSample"
        problems:
          type: array
          description: Entries that could not be read.
          items:
            $ref: "#/components/schemas/ImportProblem"
        settings:
          type: boolean
          description: Whether the file also carries account settings.
    ImportTarget:
      type: object
      description: A calendar or list found in the file, and where it would be imported.
      additionalProperties: false
      required: [name, kind, target, events, todos, skip, index]
      properties:
        name:
          type: string
          description: Name in the file.
        kind:
          type: string
          enum: [calendar, tasklist]
          description: Whether it holds events or todos.
        target:
          type: string
          description: Calendar or list ID to import into, or `new` to create one.
        events:
          type: integer
          minimum: 0
          description: Events found, counting changed occurrences.
        todos:
          type: integer
          minimum: 0
          description: Todos found, counting subtasks.
        skip:
          type: boolean
          description: Whether this target is left out.
        index:
          type: integer
          minimum: 0
          description: Send this back in the commit body to choose where it goes.
        timezone:
          type: string
          description: Timezone declared in the file for this calendar.
    ImportStats:
      type: object
      description: How many entries fall into each outcome.
      additionalProperties: false
      required: [new, updated, duplicate, invalid, skipped]
      properties:
        new:
          type: integer
          minimum: 0
          description: Entries that would be added.
        updated:
          type: integer
          minimum: 0
          description: Entries matching an existing one by UID.
        duplicate:
          type: integer
          minimum: 0
          description: Entries with the same title, time and place as one already here.
        invalid:
          type: integer
          minimum: 0
          description: Entries that could not be read.
        skipped:
          type: integer
          minimum: 0
          description: Entries in targets left out.
    ImportSample:
      type: object
      description: One entry from the file with what would happen to it.
      additionalProperties: false
      required: [where, title, when, action]
      properties:
        where:
          type: string
          description: Where it sits in the file.
        title:
          type: string
          description: Title of the entry.
        when:
          type: string
          description: Date, or date and time, of the entry.
        action:
          type: string
          enum: [new, updated, duplicate]
          description: What would happen on commit.
    ImportProblem:
      type: object
      description: An entry in the file that could not be read.
      additionalProperties: false
      required: [where, message]
      properties:
        where:
          type: string
          description: Where it sits in the file.
        message:
          type: string
          description: What is wrong with it.
    ImportCommit:
      type: object
      description: Where each part of the file goes.
      additionalProperties: false
      properties:
        targets:
          type: array
          description: Choices by target index. Targets left out keep the choice from the preview.
          items:
            $ref: "#/components/schemas/ImportChoice"
    ImportChoice:
      type: object
      description: Where one target goes.
      additionalProperties: false
      required: [index]
      properties:
        index:
          type: integer
          minimum: 0
          description: The `index` of a target from the preview.
        target:
          type: string
          description: Calendar or list ID to import into, or `new` to create one.
        skip:
          type: boolean
          description: Leave this target out.
    Subscription:
      type: object
      description: An ICS feed followed as a read-only calendar.
      additionalProperties: false
      required: [id, calendar_id, url, refresh_every, status, next_refresh_at, last_ok_at]
      properties:
        id:
          type: string
          format: uuid
          description: Subscription ID.
        calendar_id:
          type: string
          format: uuid
          description: Read-only calendar filled from the feed.
        url:
          type: string
          description: Address of the feed.
        refresh_every:
          type: string
          description: How often the feed is fetched, as a duration like `1h0m0s`.
        status:
          type: string
          enum: [ok, error, paused]
          description: "`error` means it has failed several times in a row; the calendar keeps its last content."
        next_refresh_at:
          type: string
          format: date-time
          description: When the next fetch is due.
        last_ok_at:
          type: string
          format: date-time
          nullable: true
          description: When the feed was last fetched successfully.
        last_error:
          type: string
          description: Why the last fetch failed.
    SubscriptionInput:
      type: object
      description: A feed to follow.
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          description: An http, https or webcal link to an .ics file.
        name:
          type: string
          maxLength: 100
          description: Name for the calendar. Defaults to the host.
        refresh_every:
          type: string
          description: How often to fetch, as a duration like `1h`. Clamped to the server minimum.
    SubscriptionList:
      type: object
      description: All subscriptions of the account.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Subscriptions in the order they were created.
          items:
            $ref: "#/components/schemas/Subscription"
    Duplicate:
      type: object
      description: Two entries that look like copies of each other.
      additionalProperties: false
      required: [id, entity, reason, score, status, a, b, created_at, resolved_at]
      properties:
        id:
          type: string
          format: uuid
          description: Pair ID.
        entity:
          type: string
          enum: [event, todo]
          description: What the pair holds.
        reason:
          type: string
          enum: [uid, fingerprint, fuzzy]
          description: "`uid` share an identifier, `fingerprint` match on title, time and place, `fuzzy` have similar titles at a similar time."
        score:
          type: number
          minimum: 0
          maximum: 1
          description: How close the two are, 1 for an exact match.
        status:
          type: string
          enum: [pending, merged, deleted, dismissed]
          description: "`pending` is waiting for review."
        a:
          $ref: "#/components/schemas/DuplicateSide"
        b:
          $ref: "#/components/schemas/DuplicateSide"
        created_at:
          type: string
          format: date-time
          description: When the pair was found.
        resolved_at:
          type: string
          format: date-time
          nullable: true
          description: When the pair was resolved.
    DuplicateSide:
      type: object
      description: One entry of a pair, as it looked when the pair was found.
      additionalProperties: false
      required: [id, title, when, where, created]
      properties:
        id:
          type: string
          format: uuid
          description: ID of the entry.
        title:
          type: string
          description: Title of the entry.
        when:
          type: string
          description: Date, or date and time, of the entry.
        where:
          type: string
          description: Calendar or list it belongs to.
        body:
          type: string
          description: Description or notes.
        location:
          type: string
          description: Location of an event.
        extra:
          type: array
          description: Short notes such as whether it repeats or how many reminders it has.
          items:
            type: string
        created:
          type: string
          format: date-time
          description: When the entry was created.
    DuplicateList:
      type: object
      description: Duplicate pairs, newest first.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: The pairs.
          items:
            $ref: "#/components/schemas/Duplicate"
    DuplicateResolve:
      type: object
      description: What to do with a pair.
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [merge, keep_a, keep_b, dismiss]
          description: "`merge` combines them, `keep_a` and `keep_b` trash the other, `dismiss` keeps both."
    TrashItem:
      type: object
      description: A deleted event or todo.
      additionalProperties: false
      required: [id, entity, title, when, where, children, deleted_at]
      properties:
        id:
          type: string
          format: uuid
          description: ID of the entry.
        entity:
          type: string
          enum: [event, todo]
          description: What the entry is.
        title:
          type: string
          description: Title of the entry.
        when:
          type: string
          description: Date, or date and time, of the entry.
        where:
          type: string
          description: Calendar or list it belonged to.
        children:
          type: integer
          minimum: 0
          description: Changed occurrences or subtasks deleted with it.
        deleted_at:
          type: string
          format: date-time
          description: When it was deleted.
    TrashList:
      type: object
      description: Deleted entries, newest first.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: The entries.
          items:
            $ref: "#/components/schemas/TrashItem"
    SearchResult:
      type: object
      description: Matching entries, best first.
      additionalProperties: false
      required: [query, type, items, next_offset]
      properties:
        query:
          type: string
          description: The query as it was read.
        type:
          type: string
          description: Kind the search was limited to, empty for both.
        items:
          type: array
          description: The matches.
          items:
            $ref: "#/components/schemas/SearchHit"
        next_offset:
          type: integer
          nullable: true
          description: Offset of the next page, null on the last page.
        warnings:
          type: array
          description: Parts of the query that were not understood.
          items:
            type: string
    SearchHit:
      type: object
      description: One matching event or todo.
      additionalProperties: false
      required: [kind, id, title, snippet, container, all_day, done, start, end]
      properties:
        kind:
          type: string
          enum: [event, todo]
          description: What the entry is.
        id:
          type: string
          format: uuid
          description: ID of the entry.
        title:
          type: string
          description: Title of the entry.
        snippet:
          type: string
          description: Start of the description or notes, with Markdown stripped.
        container:
          type: string
          description: Calendar or list it belongs to.
        all_day:
          type: boolean
          description: Whether the event spans whole days, or the todo is due on a date without a time.
        done:
          type: boolean
          description: Whether a todo is completed. Always false for events.
        start:
          type: string
          format: date-time
          nullable: true
          description: Start of an event, or the due date of a todo. Null for a todo without a date.
        end:
          type: string
          format: date-time
          nullable: true
          description: End of an event. Null for todos.
    User:
      type: object
      description: A user account with its display settings.
      additionalProperties: false
      required: [id, email, display_name, timezone, email_verified, week_start, time_format, default_view, date_only_reminder, sleep, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Account ID.
        email:
          type: string
          format: email
          description: Email address used to sign in.
        display_name:
          type: string
          maxLength: 100
          description: Name shown in the interface. Empty when not set.
        timezone:
          type: string
          description: IANA timezone used to show times, for example `Europe/Moscow`.
        email_verified:
          type: boolean
          description: Whether the email address has been confirmed.
        week_start:
          type: integer
          minimum: 0
          maximum: 6
          description: First day of the week, 0 for Sunday through 6 for Saturday.
        time_format:
          type: string
          enum: ["12h", "24h"]
          description: Clock used to show times.
        default_view:
          type: string
          enum: [day, 3day, week, month, year, agenda]
          description: View opened on the start page.
        date_only_reminder:
          type: string
          description: Time of day a reminder fires for a todo that has a date but no time, as `HH:MM`.
        sleep:
          $ref: "#/components/schemas/Sleep"
        created_at:
          type: string
          format: date-time
          description: When the account was created.
    Sleep:
      type: object
      description: Sleep hours shaded on day, 3-day and week views. Events can still be placed inside them.
      additionalProperties: false
      required: [enabled, windows]
      properties:
        enabled:
          type: boolean
          description: Whether sleep hours are shown.
        windows:
          type: array
          maxItems: 7
          description: At most one window per weekday. A window ending earlier than it starts crosses midnight.
          items:
            $ref: "#/components/schemas/SleepWindow"
    SleepWindow:
      type: object
      description: Sleep hours starting on one weekday, in the account timezone.
      additionalProperties: false
      required: [weekday, start, end]
      properties:
        weekday:
          type: integer
          minimum: 0
          maximum: 6
          description: Weekday the window starts on, 0 for Sunday.
        start:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          description: Local time sleep starts, like 23:30.
        end:
          type: string
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          description: Local time sleep ends, like 07:30. Earlier than start means the next day.
    AccountInput:
      type: object
      description: Account settings to change. Send only the fields to change.
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 100
          description: Name shown in the interface.
        timezone:
          type: string
          description: IANA timezone, for example `Europe/Vilnius`.
        week_start:
          type: integer
          minimum: 0
          maximum: 6
          description: First day of the week, 0 for Sunday.
        time_format:
          type: string
          enum: ["12h", "24h"]
          description: Clock used to show times.
        default_view:
          type: string
          enum: [day, 3day, week, month, year, agenda]
          description: View opened on the start page.
        sleep:
          $ref: "#/components/schemas/Sleep"
    Calendar:
      type: object
      description: A calendar that groups events.
      additionalProperties: false
      required: [id, name, color, description, timezone, kind, read_only, is_default, hidden, position, default_reminders, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Calendar ID.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name shown in the interface.
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          description: Color of the calendar's events as a lowercase hex value.
        description:
          type: string
          maxLength: 2000
          description: Free text description. Empty when not set.
        timezone:
          type: string
          nullable: true
          description: IANA timezone for new events, or null to use the account timezone.
        kind:
          type: string
          enum: [local, subscription]
          description: "`local` for calendars kept in this app, `subscription` for calendars filled from an ICS feed."
        read_only:
          type: boolean
          description: Whether events of this calendar can be changed. Subscription calendars are read only.
        is_default:
          type: boolean
          description: Whether new events go here when no calendar is chosen. The default calendar cannot be deleted.
        hidden:
          type: boolean
          description: Whether the calendar is hidden from calendar views.
        position:
          type: integer
          minimum: 0
          description: Sort order in lists, lowest first.
        default_reminders:
          type: array
          maxItems: 5
          description: Minutes before start at which new events of this calendar remind by default.
          items:
            type: integer
            minimum: 0
            maximum: 40320
        created_at:
          type: string
          format: date-time
          description: When the calendar was created.
        updated_at:
          type: string
          format: date-time
          description: When the calendar was last changed.
    CalendarList:
      type: object
      description: All calendars of the account.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Calendars ordered by position.
          items:
            $ref: "#/components/schemas/Calendar"
    CalendarInput:
      type: object
      description: >-
        Calendar fields to set. On create only `name` is required. On update send only the fields to change.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name shown in the interface.
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Hex color. Stored in lowercase.
        description:
          type: string
          maxLength: 2000
          description: Free text description.
        timezone:
          type: string
          nullable: true
          description: IANA timezone for new events. Null or an empty string uses the account timezone.
        hidden:
          type: boolean
          description: Hide the calendar from calendar views.
        position:
          type: integer
          minimum: 0
          maximum: 10000
          description: Sort order in lists, lowest first.
        default_reminders:
          type: array
          maxItems: 5
          description: Minutes before start for default reminders. Duplicates are removed.
          items:
            type: integer
            minimum: 0
            maximum: 40320
    Problem:
      type: object
      description: Error details in the RFC 9457 format.
      additionalProperties: false
      required: [type, title, status]
      properties:
        type:
          type: string
          description: URI that identifies the error type. `about:blank` means the HTTP status explains it.
        title:
          type: string
          description: Short summary of the HTTP status.
        status:
          type: integer
          description: HTTP status code.
        detail:
          type: string
          description: Explanation specific to this request.
        instance:
          type: string
          description: Path of the request that failed.
        request_id:
          type: string
          description: Identifier of the request, the same as the `X-Request-ID` header.
        errors:
          type: array
          description: Invalid fields, present on `422` responses.
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      description: One invalid input field.
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: Name of the field in the request.
        message:
          type: string
          description: What is wrong with the value.
    Event:
      type: object
      description: An event, a recurring series, or one occurrence of a series.
      additionalProperties: false
      required: [id, calendar_id, uid, series_id, instance, recurring, title, body, location, url, all_day, start, end, timezone, rrule, rdate, exdate, status, transparency, visibility, color, read_only, reminders, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Event ID. Occurrences of a series share the series ID.
        calendar_id:
          type: string
          format: uuid
          description: Calendar the event belongs to.
        uid:
          type: string
          description: iCalendar UID, shared by a series and its changed occurrences.
        series_id:
          type: string
          format: uuid
          nullable: true
          description: Series of a changed occurrence, null otherwise.
        instance:
          type: string
          nullable: true
          description: Original start of the occurrence within its series, null for single events and unexpanded series.
        recurring:
          type: boolean
          description: Whether the event is a series or belongs to one.
        title:
          type: string
          maxLength: 1000
          description: Title. Empty when not set.
        body:
          type: string
          maxLength: 100000
          description: Description in Markdown.
        location:
          type: string
          maxLength: 1000
          description: Location text.
        url:
          type: string
          maxLength: 2048
          description: Link for the event, an http or https URL. Empty when not set.
        all_day:
          type: boolean
          description: Whether the event spans whole days.
        start:
          type: string
          description: Start as an RFC 3339 date-time in the event timezone, or a date for all-day events.
        end:
          type: string
          description: End in the same format as `start`. Exclusive for all-day events.
        timezone:
          type: string
          nullable: true
          description: IANA timezone of a timed event, null for all-day events.
        rrule:
          type: string
          nullable: true
          description: RFC 5545 recurrence rule without the `RRULE:` prefix, null for events that do not repeat.
        rdate:
          type: array
          description: Extra occurrence starts.
          items:
            type: string
        exdate:
          type: array
          description: Starts of removed occurrences.
          items:
            type: string
        status:
          type: string
          enum: [confirmed, tentative, cancelled]
          description: Event status. Cancelled occurrences are hidden from ranges.
        transparency:
          type: string
          enum: [opaque, transparent]
          description: "`opaque` blocks time, `transparent` shows the event without blocking it."
        visibility:
          type: string
          enum: [default, private]
          description: Private events never appear on share links.
        color:
          type: string
          nullable: true
          pattern: "^#[0-9a-f]{6}$"
          description: Event color, null to use the calendar color.
        read_only:
          type: boolean
          description: Whether the event can be changed.
        reminders:
          type: array
          maxItems: 5
          description: Minutes before start at which to remind.
          items:
            type: integer
            minimum: 0
            maximum: 40320
        version:
          type: integer
          minimum: 1
          description: Increases with every change.
        created_at:
          type: string
          format: date-time
          description: When the event was created.
        updated_at:
          type: string
          format: date-time
          description: When the event was last changed.
    EventList:
      type: object
      description: Events ordered by start.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Events and occurrences.
          items:
            $ref: "#/components/schemas/Event"
    EventInput:
      type: object
      description: >-
        Event fields to set. On create only `start` is required. On update send only the fields to change,
        and `null` to clear a field.
      additionalProperties: false
      properties:
        calendar_id:
          type: string
          format: uuid
          description: Calendar for the event. Defaults to the default calendar.
        uid:
          type: string
          maxLength: 1000
          description: iCalendar UID, only on create. Defaults to the event ID.
        title:
          type: string
          maxLength: 1000
          description: Title.
        body:
          type: string
          maxLength: 100000
          description: Description in Markdown.
        location:
          type: string
          nullable: true
          maxLength: 1000
          description: Location text.
        url:
          type: string
          nullable: true
          maxLength: 2048
          description: An http or https link.
        all_day:
          type: boolean
          description: Whether the event spans whole days. Changing it requires `start`.
        start:
          type: string
          description: RFC 3339 date-time, a local date-time like `2026-09-11T10:00` read in `timezone`, or a date for all-day events.
        end:
          type: string
          nullable: true
          description: End in the same format as `start`. Null resets to the default duration.
        timezone:
          type: string
          nullable: true
          description: IANA timezone of a timed event.
        rrule:
          type: string
          nullable: true
          maxLength: 1000
          description: RFC 5545 recurrence rule, daily or less often. Null stops repeating.
        rdate:
          type: array
          nullable: true
          maxItems: 1000
          description: Extra occurrence starts in the same format as `start`.
          items:
            type: string
        exdate:
          type: array
          nullable: true
          maxItems: 5000
          description: Starts of occurrences to remove, in the same format as `start`.
          items:
            type: string
        status:
          type: string
          enum: [confirmed, tentative, cancelled]
          description: Event status.
        transparency:
          type: string
          enum: [opaque, transparent]
          description: Whether the event blocks time.
        visibility:
          type: string
          enum: [default, private]
          description: Private events never appear on share links.
        color:
          type: string
          nullable: true
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Event color, null to use the calendar color.
        reminders:
          type: array
          nullable: true
          maxItems: 5
          description: Minutes before start. Null or an empty list removes reminders.
          items:
            type: integer
            minimum: 0
            maximum: 40320
    TodoList:
      type: object
      description: A list that groups todos.
      additionalProperties: false
      required: [id, name, color, position, is_default, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: List ID.
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name shown in the interface.
        color:
          type: string
          pattern: "^#[0-9a-f]{6}$"
          description: Color of the list as a lowercase hex value.
        position:
          type: integer
          minimum: 0
          description: Sort order, lowest first.
        is_default:
          type: boolean
          description: Whether new todos go here when no list is chosen. The default list cannot be deleted.
        created_at:
          type: string
          format: date-time
          description: When the list was created.
        updated_at:
          type: string
          format: date-time
          description: When the list was last changed.
    TodoListList:
      type: object
      description: All todo lists of the account.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Lists ordered by position.
          items:
            $ref: "#/components/schemas/TodoList"
    TodoListInput:
      type: object
      description: List fields to set. On create only `name` is required.
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Name shown in the interface.
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          description: Hex color. Stored in lowercase.
        position:
          type: integer
          minimum: 0
          maximum: 10000
          description: Sort order, lowest first.
    Check:
      type: object
      description: One checklist item.
      additionalProperties: false
      required: [id, text, done, position, done_at]
      properties:
        id:
          type: string
          format: uuid
          description: Item ID.
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Item text.
        done:
          type: boolean
          description: Whether the item is checked.
        position:
          type: string
          description: Sort key, items sort by it as plain strings.
        done_at:
          type: string
          format: date-time
          nullable: true
          description: When the item was checked, null when unchecked.
    CheckList:
      type: object
      description: Checklist items in order.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          description: Items ordered by position.
          items:
            $ref: "#/components/schemas/Check"
    CheckInput:
      type: object
      description: Checklist item fields. `text` is required when adding an item.
      additionalProperties: false
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
          description: Item text.
        done:
          type: boolean
          description: Whether the item is checked.
    CheckOrder:
      type: object
      description: New order of a checklist.
      additionalProperties: false
      required: [ids]
      properties:
        ids:
          type: array
          description: Every item ID of the todo in the new order.
          items:
            type: string
            format: uuid
    Todo:
      type: object
      description: A todo with its checklist.
      additionalProperties: false
      required: [id, list_id, parent_id, title, body, status, priority, position, due_date, due_time, duration_min, timezone, rrule, show_on_calendar, completed_at, reminders, checks, version, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: Todo ID.
        list_id:
          type: string
          format: uuid
          description: List the todo belongs to.
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent of a subtask, null for top-level todos.
        title:
          type: string
          minLength: 1
          maxLength: 1000
          description: Title.
        body:
          type: string
          maxLength: 100000
          description: Notes in Markdown.
        status:
          type: string
          enum: [needs_action, completed]
          description: Todo status.
        priority:
          type: integer
          minimum: 0
          maximum: 3
          description: 0 none, 1 low, 2 medium, 3 high.
        position:
          type: string
          description: Sort key within the list and parent, todos sort by it as plain strings.
        due_date:
          type: string
          format: date
          nullable: true
          description: Due date.
        due_time:
          type: string
          nullable: true
          pattern: "^[0-2][0-9]:[0-5][0-9]$"
          description: Due time in `timezone`, null for todos due on a date.
        duration_min:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440
          description: Length of the calendar block in minutes, null for the default of 30.
        timezone:
          type: string
          nullable: true
          description: IANA timezone of `due_time`.
        rrule:
          type: string
          nullable: true
          description: RFC 5545 recurrence rule. Completing the todo creates the next occurrence.
        show_on_calendar:
          type: boolean
          description: Whether the todo appears in calendar views.
        completed_at:
          type: string
          format: date-time
          nullable: true
          description: When the todo was completed.
        reminders:
          type: array
          maxItems: 5
          description: Minutes before the due time at which to remind.
          items:
            type: integer
            minimum: 0
            maximum: 40320
        checks:
          type: array
          description: Checklist items in order.
          items:
            $ref: "#/components/schemas/Check"
        version:
          type: integer
          minimum: 1
          description: Increases with every change, including checklist changes.
        created_at:
          type: string
          format: date-time
          description: When the todo was created.
        updated_at:
          type: string
          format: date-time
          description: When the todo was last changed.
    TodoPage:
      type: object
      description: One page of todos.
      additionalProperties: false
      required: [items, next_cursor]
      properties:
        items:
          type: array
          description: Todos in creation order.
          items:
            $ref: "#/components/schemas/Todo"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page, null on the last page.
    TodoCompletion:
      type: object
      description: Result of completing a todo.
      additionalProperties: false
      required: [todo, next_id]
      properties:
        todo:
          $ref: "#/components/schemas/Todo"
        next_id:
          type: string
          format: uuid
          nullable: true
          description: Next occurrence of a recurring todo, null otherwise.
    TodoMove:
      type: object
      description: Where to move a todo.
      additionalProperties: false
      properties:
        list_id:
          type: string
          format: uuid
          description: Target list.
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: New parent, null to make the todo top-level.
        after_id:
          type: string
          format: uuid
          nullable: true
          description: Place the todo right after this one, null to place it first.
    TodoInput:
      type: object
      description: >-
        Todo fields to set. On create only `title` is required. On update send only the fields to change,
        and `null` to clear a field.
      additionalProperties: false
      properties:
        list_id:
          type: string
          format: uuid
          description: List for the todo.
        parent_id:
          type: string
          format: uuid
          nullable: true
          description: Parent todo, which must be top-level. Subtasks always share the parent's list.
        title:
          type: string
          minLength: 1
          maxLength: 1000
          description: Title.
        body:
          type: string
          maxLength: 100000
          description: Notes in Markdown.
        priority:
          type: integer
          minimum: 0
          maximum: 3
          description: 0 none, 1 low, 2 medium, 3 high.
        due_date:
          type: string
          nullable: true
          description: Due date like `2026-09-12`.
        due_time:
          type: string
          nullable: true
          description: Due time like `18:00`, requires `due_date`.
        duration_min:
          type: integer
          nullable: true
          minimum: 1
          maximum: 1440
          description: Length of the calendar block in minutes.
        timezone:
          type: string
          nullable: true
          description: IANA timezone of `due_time`.
        rrule:
          type: string
          nullable: true
          maxLength: 1000
          description: RFC 5545 recurrence rule, requires `due_date`.
        show_on_calendar:
          type: boolean
          description: Whether the todo appears in calendar views.
        reminders:
          type: array
          nullable: true
          maxItems: 5
          description: Minutes before the due time.
          items:
            type: integer
            minimum: 0
            maximum: 40320
        checks:
          type: array
          maxItems: 200
          description: Initial checklist, only on create.
          items:
            $ref: "#/components/schemas/CheckInput"
