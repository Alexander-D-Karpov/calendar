openapi: 3.0.3
info:
  title: Calendar API
  version: 1.0.0
  contact:
    name: Source code
    url: https://github.com/Alexander-D-Karpov/calendar
  description: |
    JSON API for calendars, events, todos and share links. All operations live under `/api/v1`.

    ## Authentication

    Send an API token in the `Authorization` header:

        Authorization: Bearer cal_<prefix>_<secret>

    Create tokens in [Settings → API tokens](/settings/tokens). A token is shown once, right after it is created, and can be revoked at any time. To try requests on this page with a token, press **Authorize** and paste it.

    Requests from a signed-in browser session work too. With a session, unsafe methods (`POST`, `PUT`, `PATCH` and `DELETE`) also need the `X-CSRF-Token` header. **Try it out** on this page adds that header when you are signed in.

    ## Scopes

    Each token carries one or more scopes, and each operation names the scope it needs. A `write` scope includes `read` access to the same resource. Browser sessions have every scope.

    | Scope | Allows |
    |---|---|
    | `account:read` | Reading the account profile |
    | `account:write` | Changing account settings and the sleep schedule |
    | `calendars:read` | Reading calendars and events |
    | `calendars:write` | Creating, changing and deleting calendars and events |
    | `todos:read` | Reading todo lists, todos and checks |
    | `todos:write` | Creating, changing, completing and deleting todos |
    | `shares:read` | Reading share links |
    | `shares:write` | Creating, changing, regenerating and revoking share links |
    | `imports:write` | Uploading and committing imports |
    | `exports:read` | Downloading ICS, CSV and YAML exports |
    | `sync:write` | Reading Google sync status and starting a sync |

    A token can already be created with the scopes marked above and will keep working
    once the matching endpoints land, but nothing accepts them today.

    ## MCP

    Agents use the same tokens over the Model Context Protocol at `/api/mcp` (Streamable HTTP, JSON responses, bearer token only). `tools/list` returns only the tools the token's scopes allow, and tool inputs match `EventInput` and `TodoInput` below.

    ## Concurrency

    Single resources carry an `ETag` header. Send it back in `If-Match` on `PATCH` and `DELETE` to fail with `412` instead of overwriting someone else's change. `PATCH` bodies are JSON Merge Patch: send only the fields to change, and `null` to clear a nullable field.

    ## Idempotency

    `POST /events`, `/todos`, `/calendars`, `/todo-lists`, `/imports` and `/shares` accept an `Idempotency-Key` header of 1 to 255 characters. The first request under a key is carried out and its reply stored; repeating the key returns that same reply with `Idempotency-Replayed: true` instead of creating a second entry, which makes a retry after a dropped connection safe.

    Reusing a key with a different body answers `422`. Repeating it while the first request is still running answers `409`. A key is only remembered for a successful request, so after a `4xx` you can correct the body and retry with the same one.

    ## Errors

    Errors use `application/problem+json` as defined in RFC 9457. `detail` explains the problem, `errors` lists invalid fields on `422` responses, and `request_id` matches the `X-Request-ID` response header.

    ## Rate limits

    Authenticated responses carry `RateLimit-Limit`, `RateLimit-Remaining` and `RateLimit-Reset`. Past the limit the API answers `429` with a `Retry-After` header. Repeated invalid tokens from one address are blocked the same way.
servers:
  - url: /api/v1
    description: This server
tags:
  - name: Account
    description: The account that owns the token or session.
  - name: Calendars
    description: Calendars group events. Every account has one default calendar that cannot be deleted.
  - name: Events
    description: Events of calendars, including recurring series and occurrences changed on their own.
  - name: Todo lists
    description: Lists group todos. Every account has one default list that cannot be deleted.
  - name: Todos
    description: Todos with an optional due date and time, one level of subtasks, and recurrence on completion.
  - name: Checks
    description: Checklist items inside a todo. Checking every item does not complete the todo.
  - name: Imports
    description: Uploading a file, reviewing what it holds, and writing it in.
  - name: Exports
    description: Downloading calendars and the whole account.
  - name: Subscriptions
    description: ICS feeds followed as read-only calendars.
  - name: Duplicates
    description: Entries that look like copies of each other, and how to resolve them.
  - name: Trash
    description: Deleted events and todos, kept until the retention window passes.
  - name: Search
    description: Finding events and todos by text and filters.
  - name: Shares
    description: Read-only links to one fixed period of the calendar.
  - name: Changes
    description: An ordered log of what changed, for catching up without refetching.
  - name: Sync
    description: The Google Calendar and Tasks connection.
paths:
  /me:
    get:
      tags: [Account]
      operationId: getMe
      summary: Get the current account
      description: |
        Returns the account that owns the API token or browser session, with its display settings and sleep schedule. Use it to check that a token works.

        Requires scope `account:read`.
      x-scope: account:read
      security: &readAuth
        - bearerAuth: []
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The current account.
          headers: &resourceHeaders
            ETag:
              $ref: "#/components/headers/ETag"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example: &userExample
                id: "01a08b9b-3dce-7ae6-b07c-a83315ccc2fe"
                email: sasha@akarpov.ru
                display_name: Sasha
                timezone: Europe/Moscow
                email_verified: true
                week_start: 1
                time_format: "24h"
                default_view: week
                date_only_reminder: "09:00"
                sleep:
                  enabled: true
                  windows:
                    - weekday: 1
                      start: "23:30"
                      end: "07:30"
                created_at: "2026-09-10T13:56:42Z"
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Account]
      operationId: updateMe
      summary: Update account settings
      description: |
        Changes the fields present in the body as a JSON Merge Patch. `sleep` replaces the whole schedule, so send every window to keep. Email and password cannot be changed here.

        Requires scope `account:write`.
      x-scope: account:write
      security: &writeAuth
        - bearerAuth: []
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/AccountInput"
            example:
              timezone: Europe/Vilnius
              sleep:
                enabled: true
                windows:
                  - weekday: 0
                    start: "23:00"
                    end: "07:00"
          application/json:
            schema:
              $ref: "#/components/schemas/AccountInput"
            example:
              time_format: "12h"
      responses:
        "200":
          description: The updated account.
          headers: *resourceHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example: *userExample
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /calendars:
    get:
      tags: [Calendars]
      operationId: listCalendars
      summary: List calendars
      description: |
        Returns every calendar of the account ordered by `position`. Hidden calendars are included.

        Requires scope `calendars:read`.
      x-scope: calendars:read
      security: *readAuth
      responses:
        "200":
          description: All calendars of the account.
          headers: &okHeaders
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarList"
              example:
                items:
                  - &calendarExample
                    id: "0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10"
                    name: Work
                    color: "#3b6ea5"
                    description: ""
                    timezone: Europe/Moscow
                    kind: local
                    read_only: false
                    is_default: false
                    hidden: false
                    position: 1
                    default_reminders: [10]
                    created_at: "2026-09-10T13:56:42Z"
                    updated_at: "2026-09-10T14:02:11Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Calendars]
      operationId: createCalendar
      summary: Create a calendar
      description: |
        Creates a local calendar. Only `name` is required. The calendar is placed after the others unless `position` is set. An account can have at most 100 calendars.

        Requires scope `calendars:write`.
      x-scope: calendars:write
      security: *writeAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarInput"
            example:
              name: Work
              color: "#3b6ea5"
              timezone: Europe/Moscow
              default_reminders: [10]
      responses:
        "201":
          description: The created calendar.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
              example: *calendarExample
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /calendars/{id}:
    parameters:
      - $ref: "#/components/parameters/CalendarID"
    get:
      tags: [Calendars]
      operationId: getCalendar
      summary: Get a calendar
      description: |
        Returns one calendar. Send the `ETag` from an earlier response in `If-None-Match` to get `304` when nothing changed.

        Requires scope `calendars:read`.
      x-scope: calendars:read
      security: *readAuth
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The calendar.
          headers: *resourceHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
              example: *calendarExample
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Calendars]
      operationId: updateCalendar
      summary: Update a calendar
      description: |
        Changes the fields present in the body as a JSON Merge Patch. Send `"timezone": null` to fall back to the account timezone. `kind`, `read_only` and `is_default` cannot be changed.

        Requires scope `calendars:write`.
      x-scope: calendars:write
      security: *writeAuth
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/CalendarInput"
            example:
              name: Personal
              timezone: null
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarInput"
            example:
              hidden: true
      responses:
        "200":
          description: The updated calendar.
          headers: *resourceHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
              example: *calendarExample
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Calendars]
      operationId: deleteCalendar
      summary: Delete a calendar
      description: |
        Deletes the calendar together with all of its events and removes it from share links. The default calendar cannot be deleted.

        Requires scope `calendars:write`.
      x-scope: calendars:write
      security: *writeAuth
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The calendar and its events were deleted.
          headers: *okHeaders
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /events:
    get:
      tags: [Events]
      operationId: listEvents
      summary: List events in a time range
      description: |
        Returns events that overlap the range from `from` to `to`, ordered by start. The range can be at most 400 days. All-day events are matched by date in the account timezone.

        Recurring series are expanded into occurrences. An occurrence of a series carries the series `id` and its original start in `instance`. An occurrence changed on its own has its own `id`, the series in `series_id` and its original start in `instance`. With `expand=false` the stored series, changed occurrences and single events are returned without expansion.

        Requires scope `calendars:read`.
      x-scope: calendars:read
      security: *readAuth
      parameters:
        - $ref: "#/components/parameters/RangeFrom"
        - $ref: "#/components/parameters/RangeTo"
        - $ref: "#/components/parameters/CalendarFilter"
        - $ref: "#/components/parameters/Expand"
      responses:
        "200":
          description: Events and occurrences in the range.
          headers: *okHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
              example:
                items:
                  - &eventExample
                    id: "0191f2c5-1b2c-7d4e-8f90-a1b2c3d4e5f6"
                    calendar_id: "0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10"
                    uid: "0191f2c5-1b2c-7d4e-8f90-a1b2c3d4e5f6"
                    series_id: null
                    instance: "2026-09-11T10:00:00+03:00"
                    recurring: true
                    title: Standup
                    body: "Agenda and **notes**"
                    location: Office
                    url: ""
                    all_day: false
                    start: "2026-09-11T10:00:00+03:00"
                    end: "2026-09-11T10:15:00+03:00"
                    timezone: Europe/Moscow
                    rrule: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR"
                    rdate: []
                    exdate: ["2026-09-14T10:00:00+03:00"]
                    status: confirmed
                    transparency: opaque
                    visibility: default
                    color: null
                    read_only: false
                    reminders: [10]
                    version: 3
                    created_at: "2026-09-10T13:56:42Z"
                    updated_at: "2026-09-10T14:02:11Z"
                  - id: "0191f2c6-2d3e-7f40-8a51-b2c3d4e5f607"
                    calendar_id: "0191f2c4-7a1b-7c3e-9a51-2b7d0e4f6a10"
                    uid: "0191f2c6-2d3e-7f40-8a51-b2c3d4e5f607"
                    series_id: null
                    instance: null
                    recurring: false
                    title: Conference
                    body: ""
                    location: Vilnius
                    url: "https://example.com/conf"
                    all_day: true
                    start: "2026-09-20"
                    end: "2026-09-22"
                    timezone: null
                    rrule: null
                    rdate: []
                    exdate: []
                    status: tentative
                    transparency: transparent
                    visibility: private
                    color: "#aa3355"
                    read_only: false
                    reminders: []
                    version: 1
                    created_at: "2026-09-10T13:56:42Z"
                    updated_at: "2026-09-10T13:56:42Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Events]
      operationId: createEvent
      summary: Create an event
      description: |
        Creates an event. Only `start` is required. Without `calendar_id` the event goes to the default calendar. Without `end` a timed event lasts one hour and an all-day event one day. Times without an offset are read in `timezone`, which defaults to the calendar timezone and then the account timezone. Without `reminders` the calendar's default reminders are used.

        Requires scope `calendars:write`.
      x-scope: calendars:write
      security: *writeAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
            examples:
              recurring:
                summary: Weekday standup
                value:
                  title: Standup
                  start: "2026-09-11T10:00:00+03:00"
                  end: "2026-09-11T10:15:00+03:00"
                  timezone: Europe/Moscow
                  rrule: "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR"
                  reminders: [10]
              allDay:
                summary: All-day event
                value:
                  title: Conference
                  all_day: true
                  start: "2026-09-20"
                  end: "2026-09-22"
      responses:
        "201":
          description: The created event.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            Location:
              $ref: "#/components/headers/Location"
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimitLimit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimitRemaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimitReset"
            X-Request-ID:
              $ref: "#/components/headers/RequestID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
              example: *eventExample
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: getEvent
      summary: Get an event
      description: |
        Returns one stored event: a single event, a recurring series or an occurrence changed on its own. Use `GET /events/{id}/instances` for the occurrences of a series.

        Requires scope `calendars:read`.
      x-scope: calendars:read
      security: *readAuth
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: The event.
          headers: *resourceHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
              example: *eventExample
        "304":
          $ref: "#/components/responses/NotModified"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    patch:
      tags: [Events]
      operationId: updateEvent
      summary: Update an event
      description: |
        Changes the fields present in the body as a JSON Merge Patch. Changing `start` without `end` keeps the duration.

        For a recurring series, `scope` and `instance` choose what changes:

        - `this` changes one occurrence and returns it as a changed occurrence.
        - `following` ends the series before the occurrence and starts a new series there with the changes applied. The response is the new series. Its `uid` is the old one with `_R` and the occurrence start in UTC appended, as in `<uid>_R20260911T100000Z`, or a fresh ID when that would pass 1000 characters. Changed occurrences, extra dates and excluded dates at or after the split move to the new series.
        - `all` applies the fields to the series itself, so `start` sets the first occurrence. Moving the start also moves excluded dates, extra dates and changed occurrences by the same amount, unless the request sets `rdate` or `exdate` itself, or changes `all_day` or `rrule`.

        A changed occurrence that no longer falls on the rule is deleted.

        Recurrence fields can only change with `following` or `all`. `uid` cannot be changed.

        Requires scope `calendars:write`.
      x-scope: calendars:write
      security: *writeAuth
      parameters:
        - $ref: "#/components/parameters/EditScope"
        - $ref: "#/components/parameters/Instance"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: "#/components/schemas/EventInput"
            example:
              start: "2026-09-11T11:00:00+03:00"
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
            example:
              title: Standup moved
              location: null
      responses:
        "200":
          description: The changed event, changed occurrence or new series.
          headers: *resourceHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
              example: *eventExample
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Events]
      operationId: deleteEvent
      summary: Delete an event
      description: |
        Deletes the event and moves it to the trash. For a recurring series, `this` excludes one occurrence and deletes the changed copy of it if there is one, `following` ends the series before the occurrence, and `all` deletes the series with every changed occurrence.

        Requires scope `calendars:write`.
      x-scope: calendars:write
      security: *writeAuth
      parameters:
        - $ref: "#/components/parameters/EditScope"
        - $ref: "#/components/parameters/Instance"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "204":
          description: The event or occurrences were deleted.
          headers: *okHeaders
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /events/{id}/instances:
    parameters:
      - $ref: "#/components/parameters/EventID"
    get:
      tags: [Events]
      operationId: listEventInstances
      summary: List occurrences of an event
      description: |
        Returns the occurrences of one event that overlap the range, including occurrences changed on their own. A single event returns itself when it overlaps the range.

        Requires scope `calendars:read`.
      x-scope: calendars:read
      security: *readAuth
      parameters:
