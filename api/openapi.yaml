  /search:
    get:
      tags: [Search]
      operationId: search
      summary: Search events and todos
      description: |
        Finds events and todos by text, ranked by how well they match and how close they are to today.

        The query accepts `"exact phrase"` and `-exclude`, plus filters:

        | Filter | Matches |
        |---|---|
        | `in:<name>` | that calendar or list |
        | `type:event`, `type:todo` | one kind |
        | `is:open`, `is:done`, `is:overdue` | todo status |
        | `is:recurring`, `is:private` | repeating entries, private events |
        | `has:time`, `has:checks`, `has:body`, `has:location`, `has:reminders` | entries with that |
        | `after:`, `before:` | a date like `2026-09-10`, `today`, or an offset like `+7d` |
        | `priority:>=2` | todos at that priority |

        A filter that cannot apply to a kind excludes that kind, so `is:done` returns todos only. Filters that were not understood are reported in `warnings` and used as plain words.

        Recurring events match once, as the series.

        Requires scope `calendars:read`.
      x-scope: calendars:read
      security: *readAuth
      parameters:
        - $ref: "#/components/parameters/SearchQuery"
        - $ref: "#/components/parameters/SearchType"
        - $ref: "#/components/parameters/SearchLimit"
        - $ref: "#/components/parameters/SearchOffset"
      responses:
        "200":
          description: Matching entries, best first.
          headers: *okHeaders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
              example:
                query: standup in:Work
                type: ""
                items:
                  - kind: event
                    id: "0191f2c5-1b2c-7d4e-8f90-a1b2c3d4e5f6"
                    title: Standup
                    snippet: Agenda and notes
                    container: Work
                    all_day: false
                    done: false
                    start: "2026-09-07T07:00:00Z"
                    end: "2026-09-07T07:15:00Z"
                next_offset: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
