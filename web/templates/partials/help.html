{{define "help"}}
<dialog class="modal" id="help">
    <div class="modal-body">
        <header class="section-head">
            <h2>Keyboard shortcuts</h2>
        </header>
        <table class="table">
            <tbody>
            <tr><td><kbd>d</kbd> <kbd>3</kbd> <kbd>w</kbd> <kbd>m</kbd> <kbd>y</kbd> <kbd>a</kbd></td><td>Switch view</td></tr>
            <tr><td><kbd>t</kbd></td><td>Today</td></tr>
            <tr><td><kbd>j</kbd> <kbd>k</kbd></td><td>Next and previous period</td></tr>
            <tr><td><kbd>c</kbd></td><td>New event</td></tr>
            <tr><td><kbd>/</kbd></td><td>Search everything</td></tr>
            <tr><td><kbd>Ctrl</kbd> <kbd>F</kbd></td><td>Find on this page</td></tr>
            <tr><td><kbd>Ctrl</kbd> <kbd>Z</kbd></td><td>Undo the last change</td></tr>
            <tr><td><kbd>?</kbd></td><td>This list</td></tr>
            <tr><td><kbd>Esc</kbd></td><td>Close</td></tr>
            </tbody>
        </table>
        <form method="dialog"><button type="submit" class="btn">Close</button></form>
    </div>
</dialog>
{{end}}
