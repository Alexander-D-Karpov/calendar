# HTTP_TRUSTED_PROXIES must contain this server's address, or ClientIPResolver
# keeps the proxy IP for every request and each per-IP rate limit becomes a
# single global one shared by all visitors.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name calendar.akarpov.ru;

    ssl_certificate     /etc/letsencrypt/live/calendar.akarpov.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/calendar.akarpov.ru/privkey.pem;

    # Imports accept a 20MB file by default; keep this above IMPORT_MAX_SIZE.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Live updates hold a websocket open; without this nginx closes it every
        # 60 seconds and every client reconnects in lockstep.
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name calendar.akarpov.ru;
    return 301 https://$host$request_uri;
}
