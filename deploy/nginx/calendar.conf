# HTTP only on purpose. `certbot --nginx` adds the listen 443 block, the
# certificate paths and the port 80 redirect to this file itself. Writing the
# TLS block by hand first would point nginx at a certificate that does not exist
# yet, so `nginx -t` would fail and certbot could never run.
#
# HTTP_TRUSTED_PROXIES must contain the address nginx connects from. Requests
# arrive through a published container port, so the app sees the docker gateway,
# which is why the default covers 172.16.0.0/12. Without it ClientIPResolver
# keeps the proxy address for every request and each per-IP rate limit becomes a
# single global one shared by every visitor.

# Named for this site because $connection_upgrade is already defined by other
# sites on the host, and a second definition of the same variable fails
# `nginx -t` for every site at once, not just this one.
map $http_upgrade $calendar_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name calendar.akarpov.ru;

    # Imports accept a 20MB file by default; keep this above IMPORT_MAX_SIZE.
    client_max_body_size 25m;

    location / {
        # The host side of the container's port mapping, APP_HOST_PORT in .env,
        # not the port the app listens on inside the container.
        proxy_pass http://127.0.0.1:8090;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $calendar_connection_upgrade;

        # Live updates hold a websocket open; without this nginx closes it every
        # 60 seconds and every client reconnects in lockstep.
        proxy_read_timeout 3600s;
    }
}
