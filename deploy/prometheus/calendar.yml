  # --- calendar: appended fragment, keep this marker line ---
  #
  # Append to the END of scrape_configs in prometheus.yml. The two space indent
  # is load bearing: these are list items under scrape_configs, and appending
  # them at column zero makes the file invalid, which Prometheus reports only in
  # its log while it carries on serving the previous config.
  #
  # Check before reloading, it exits non-zero on a bad file:
  #   docker exec prometheus promtool check config /etc/prometheus/prometheus.yml
  #
  # Two processes export separately: HTTP metrics only exist on the app, job and
  # queue metrics only on the worker. Scraping one hides half the system.
  #
  # METRICS_TOKEN guards /metrics. Keep it in a file rather than inline, written
  # without a trailing newline or the bearer credential will not match.
  - job_name: 'calendar'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/calendar.token
    static_configs:
      - targets: ['calendar-app-1:9091']
        labels:
          component: 'app'
      - targets: ['calendar-worker-1:9092']
        labels:
          component: 'worker'
